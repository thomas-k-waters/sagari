name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.13"]
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q

  oldest-supported:
    name: oldest supported dependencies (Python 3.10)
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      - run: pip install "numpy==1.26.4" "scipy==1.11.4" "scikit-learn==1.3.2" "pandas==2.0.3" "emcee==3.1.4" "pyyaml==6.0" pytest
      - run: pip install --no-deps -e .
      - run: pytest -q
