# Every campaign setting with the value adopted in Waters & Gultekin (2026); these are also the defaults.
# Use with:  sagari init my_campaign --space space_m86.yaml --settings settings_paper.yaml
seed: 20260817
n_initial: 256
n_round: 128
converge_on: [mbh, upsilon]
stop:      {frac: 0.2, patience: 1, min_rounds: 2, max_rounds: 20}
sampler:   {kernel: matern52, train_window: 30.0, global_fraction: 0.35}
estimate:  {n_train_cap: 300}
errorbars: {n_round: 128, n_profile: 7, n_train_cap: 1000, sd_tol: 3.0, frac: 0.2, levels: [4.0, 10.0],
            max_rounds: 3, auto_window: false}
